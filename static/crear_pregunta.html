<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Trivia Exacta - Creando materia</title>
</head>
<body>
    <h1>Añade una Pregunta a una materia</h1> 
    
    <p>Recuerda siempre que debes ser respetuoso con las consignas que añadas</p>
    <!-- Las materias es posible verificarlas pero no así las consignas -->

    <form action="" method="post">
        <label for=""> Materia asociada: </label>
        <select name="" id="materia_asociada">
            <option value="1">valor 1</option>
            <option value="2">valor 2</option>
            <option value="3">valor 3</option>
        </select>
        
        <label for="">Enunciado: </label>
        <input type="text" placeholder="p. e: Redes I"> 

        <p>Agrega sus opciones, marca la que sea verdadera</p>
        <ul>
            <li> <label for=""> <input type="radio" name="opcion" value="1"> Opción 1: <input type="text" name="" id=""> </label> </li>
            <li> <label for=""> <input type="radio" name="opcion" value="2"> Opción 2: <input type="text" name="" id=""> </label> </li>
            <li> <label for=""> <input type="radio" name="opcion" value="3"> Opción 3: <input type="text" name="" id=""> </label> </li>
            <li> <label for=""> <input type="radio" name="opcion" value="4"> Opción 4: <input type="text" name="" id=""> </label> </li>
            <!-- Acá puede saltar un parrafito de "recuerda seleccionar la verdadera" -->
        </ul>

        <!-- Se guarda en la base de datos 
        No lo hacemos aqui porque nos van a quitar los *.js -->
        <button type="submit">Guardar pregunta</button>
    </form>

    <a href="index.html">Volver al inicio</a>
</body>
</html>
