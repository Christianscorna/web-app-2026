        <label for=""> Materia asociada: <input type="text" placeholder="p. e: Redes I"> </label>
        <!-- Si viene del enlace anterior debería acarrear el nombre y autocompletarlo -->

        <label for=""> Enunciado: <input type="text" placeholder="p. e: ¿Qué es TCP?"> </label>

            <li> <label for=""> <input type="radio" name="opcion" value="4"> Opción 4: <input type="text" name="" id=""> </label> </li>
            <!-- Acá puede saltar un parrafito de "recuerda seleccionar la verdadera" -->
        </ul>
    </form>
